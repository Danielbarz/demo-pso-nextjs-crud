name: Build & Deploy to Cloud Run

on:
  push:
    branches: [ main ]

env:
  # Definisi variabel di satu tempat agar mudah diubah
  IMAGE_NAME: "asia-southeast2-docker.pkg.dev/kelompok-7-pso-c/kelompok7psoc/pso"
  REGION: "asia-southeast2" 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-southeast2-docker.pkg.dev

      - name: Build & Push image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy my-app-service \
            --image=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --port=3000 \
            --memory=512Mi \
            --set-env-vars="MONGODB_URL=${{ secrets.MONGODB_URL }}"
